<!DOCTYPE html>
<html>
<head>
    <title>Create Google Meet</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .navbar {
            background: #ffffff;
            padding: 18px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e5e7eb;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .nav-links a {
            margin-left: 25px;
            text-decoration: none;
            color: #374151;
        }

        .nav-links a:hover {
            color: #2563eb;
        }

        .container {
            max-width: 650px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .email-input-container {
            width: 100%;
            min-height: 48px;
            padding: 6px 8px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            background: white;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
        }

        .email-input-container:focus-within {
            border-color: #2563eb;
        }

        .email-input-container input {
            flex: 1;
            min-width: 180px;
            width: auto;
            padding: 7px;
            border: none;
            outline: none;
        }

        .email-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #e5edff;
            color: #1e40af;
            padding: 7px 10px;
            border-radius: 20px;
            font-size: 14px;
        }

        .remove-email {
            border: none;
            background: none;
            color: #1e40af;
            font-size: 16px;
            cursor: pointer;
            padding: 0;
        }

        .helper-text {
            display: block;
            margin-top: 7px;
            color: #6b7280;
            font-size: 13px;
        }

        .auto-record-option {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 20px;
        }

        .auto-record-option small {
            display: block;
            color: #666;
            margin-top: 4px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 26px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background-color: #ccc;
            border-radius: 26px;
            transition: 0.3s;
        }

        .slider:before {
            content: "";
            position: absolute;
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            border-radius: 50%;
            transition: 0.3s;
        }

        .switch input:checked + .slider {
            background-color: #4CAF50;
        }

        .switch input:checked + .slider:before {
            transform: translateX(22px);
        }

        .button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .button:hover {
            background: #1d4ed8;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #2563eb;
        }
    </style>
</head>

<body>

<nav class="navbar">
    <div class="logo">
        Google Meet Manager
    </div>

    <div class="nav-links">
        <a href="{% url 'home' %}">Dashboard</a>
        <a href="{% url 'meeting-list' %}">My Meetings</a>
    </div>
</nav>

<div class="container">

    <div class="card">

        <h1>Create Google Meet</h1>

        <p class="subtitle">
            Schedule a new Google Meet using your Google Calendar.
        </p>

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">
                <label>Meeting Title</label>
                <input
                    type="text"
                    name="meeting_title"
                    placeholder="Enter meeting title"
                    required
                >
            </div>

            <div class="form-group">
                <label>Start Time</label>
                <input
                    type="datetime-local"
                    name="start_time"
                    required
                >
            </div>

            <div class="form-group">
                <label>End Time</label>
                <input
                    type="datetime-local"
                    name="end_time"
                    required
                >
            </div>

            <div class="form-group">
                <label>Participants</label>

                <div class="email-input-container" id="emailContainer">
                    <input
                        type="text"
                        id="emailInput"
                        placeholder="Type an email and press Enter"
                        autocomplete="off"
                    >
                </div>

                <input
                    type="hidden"
                    name="participant_emails"
                    id="participantEmails"
                >

                <small class="helper-text">
                    Press Enter after each email address to add another participant.
                </small>
            </div>

            <div class="auto-record-option">

                <label class="switch">

                    <input
                        type="checkbox"
                        name="auto_record"
                        id="auto_record"
                    >

                    <span class="slider"></span>

                </label>

                <div>
                    <strong>Auto Record Meeting</strong>
                </div>

            </div>

            <div><br></div>

            <button type="submit" class="button">
                Create Google Meet
            </button>

        </form>

        <a href="{% url 'home' %}" class="back-link">
            ← Back to Dashboard
        </a>

    </div>

</div>

<script>
    const emailInput = document.getElementById("emailInput");
    const emailContainer = document.getElementById("emailContainer");
    const participantEmails = document.getElementById("participantEmails");

    let emails = [];

    emailInput.addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            event.preventDefault();

            const email = emailInput.value.trim();

            if (!email) {
                return;
            }

            if (!isValidEmail(email)) {
                alert("Please enter a valid email address.");
                return;
            }

            if (emails.includes(email)) {
                alert("This email has already been added.");
                return;
            }

            emails.push(email);

            updateEmails();

            emailInput.value = "";
        }

        if (
            event.key === "Backspace" &&
            emailInput.value === "" &&
            emails.length > 0
        ) {
            emails.pop();
            updateEmails();
        }
    });


    function isValidEmail(email) {

        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

    }


    function updateEmails() {

        const chips = emailContainer.querySelectorAll(".email-chip");

        chips.forEach(chip => chip.remove());

        emails.forEach((email, index) => {

            const chip = document.createElement("div");

            chip.className = "email-chip";

            chip.innerHTML = `
                <span>${email}</span>
                <button
                    type="button"
                    class="remove-email"
                    onclick="removeEmail(${index})"
                >
                    ×
                </button>
            `;

            emailContainer.insertBefore(
                chip,
                emailInput
            );
        });

        participantEmails.value = emails.join(",");

    }


    function removeEmail(index) {

        emails.splice(index, 1);

        updateEmails();

    }
</script>

</body>
</html>
